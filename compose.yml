# docker compose up -d
# docker compose up -d --build  
# docker compose down
services:
  redis:                              # ตั้งชื่อ Service
    image: redis:8.8.0-alpine         # เลือกใช้ Image ของ Redis
    container_name: redis             # ชื่อตัวคอนเทนเนอร์
    restart: unless-stopped           # เปิดตัวเองใหม่ตลอดเวลาหากระบบล่ม
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data              # เชื่อมต่อพื้นที่เก็บข้อมูลจำลอง เพื่อไม่ให้ข้อมูลหายเมื่อคอนเทนเนอร์ถูกปิดหรือลบ
    command: >                        # บันทึกข้อมูลลงฮาร์ดดิสก์เรื่อย ๆ กันข้อมูลสูญหาย
      redis-server
      --appendonly yes               
    healthcheck:                      # ระบบคอยตรวจสอบตัวเอง
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:                          # ส่วนจัดการ Log ของ Redis
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ai-network

  postgres:                           # docker exec -it postgres_db psql -U admin -d my_database
    image: postgres:15-alpine         # Image ของ PostgreSQL เวอร์ชัน 15
    container_name: postgres_db       # ชื่อคอนเทนเนอร์
    restart: unless-stopped
    environment:                      # ตั้งค่า Username, Password และชื่อ Database เริ่มต้น
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=my_database
    ports:
      - "5433:5432"                   # พอร์ต PostgreSQL บนโฮสต์ เพื่อหลีกเลี่ยงการชนกับ postgres ท้องถิ่น
    volumes:
      - postgres-data:/var/lib/postgresql/data  # เก็บข้อมูลจำลองไว้เพื่อไม่ให้ข้อมูลหาย     
    logging:                      
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"                 
    networks:
      - ai-network

  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: label-studio
    restart: unless-stopped
    ports:
      - "8080:8080"                   # เข้าใช้งานผ่าน http://localhost:8080
    volumes:
      - ./storage/data/label_studio_data:/label-studio/data # ทำ Label
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/data/images
    logging:                      
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ai-network

  minio:                              
    image: minio/minio:latest
    container_name: minio_server
    ports: 
      - "9000:9000"       # 9000 ใช้สำหรับเชื่อมต่อ S3 API เพื่อเขียน/อ่านไฟล์
      - "9001:9001"       # 9001 สำหรับเข้าใช้งานหน้าเว็บจัดการ (Web Console)
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
      MINIO_PROMETHEUS_AUTH_TYPE: "public" 
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    logging:                      
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ai-network
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:secretpassword@postgres:5432/my_database
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:8080"]
    volumes:
      - ./backend/src:/app/src
      - ./storage/logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  training-worker:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: training_worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
      - STORAGE_PATH=/app/storage
    volumes:
      - ./storage:/app/storage
      - ./workers:/app/workers
    depends_on:
      - redis
      - minio
    networks:
      - ai-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:         # Volumes - พื้นที่เก็บข้อมูลถาวร           # พื้นที่เพื่อให้ Services ด้านบนเรียกใช้ได้
  minio_data:
  redis-data:
  postgres-data:

networks:         # Networks - เครือข่ายภายใน
  ai-network:
    driver: bridge